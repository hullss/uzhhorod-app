spring:
  application:
    name: uzhhorod-digital-api
  config:
    # IntelliJ can start the module from the project root, while the terminal command
    # runs from backend/. Support both locations without copying secrets to the root.
    import: optional:file:./.env[.properties],optional:file:./backend/.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/uzhhorod_digital}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

transport:
  gtfs-feed-url: ${TRANSPORT_GTFS_FEED_URL:https://track.ua-gis.com/gtfs/uzhhorod/static.zip}
  gtfs-import-cron: ${TRANSPORT_GTFS_IMPORT_CRON:0 0 3 * * *}
  gtfs-import-zone: ${TRANSPORT_GTFS_IMPORT_ZONE:Europe/Kyiv}
  import-token: ${TRANSPORT_IMPORT_TOKEN:}
  realtime-source-url: ${TRANSPORT_REALTIME_SOURCE_URL:https://city.dozor.tech/data}
  realtime-source-referer: ${TRANSPORT_REALTIME_SOURCE_REFERER:https://city.dozor.tech/ua/uzhgorod/city}
  realtime-cache-duration: ${TRANSPORT_REALTIME_CACHE_DURATION:PT20S}

city-services:
  accessibility:
    datastore-url: ${ACCESSIBILITY_DATASTORE_URL:https://data.rada-uzhgorod.gov.ua/api/3/action/datastore_search?resource_id=a5301f8c-b5bc-499d-8289-e87aaeca8d4c&limit=100}
    cache-duration: ${ACCESSIBILITY_CACHE_DURATION:PT6H}
  open-data:
    catalog-api-url: ${OPEN_DATA_CATALOG_API_URL:https://data.rada-uzhgorod.gov.ua/api/3/action/package_search?sort=metadata_modified%20desc&rows=12}
    catalog-url: ${OPEN_DATA_CATALOG_URL:https://data.rada-uzhgorod.gov.ua}
    cache-duration: ${OPEN_DATA_CATALOG_CACHE_DURATION:PT15M}
  currency:
    monobank-url: ${MONOBANK_CURRENCY_URL:https://api.monobank.ua/bank/currency}
    cache-duration: ${MONOBANK_CURRENCY_CACHE_DURATION:PT5M}
  weather:
    api-url: ${WEATHER_API_URL:https://api.weatherapi.com/v1/forecast.json}
    api-key: ${WEATHER_API_KEY:}
    cache-duration: ${WEATHER_API_CACHE_DURATION:PT15M}
    latitude: ${WEATHER_LATITUDE:48.6208}
    longitude: ${WEATHER_LONGITUDE:22.2879}
  alerts:
    api-url: ${ALERTS_IN_UA_API_URL:https://api.alerts.in.ua/v1/alerts/active.json}
    api-token: ${ALERTS_IN_UA_TOKEN:}
    cache-duration: ${ALERTS_IN_UA_CACHE_DURATION:PT30S}
  news:
    source-url: ${CITY_NEWS_SOURCE_URL:https://rada-uzhgorod.gov.ua/}
    cache-duration: ${CITY_NEWS_CACHE_DURATION:PT10M}
